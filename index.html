<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <!-- Mapbox GL JS CSS -->
    <link
        href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
        rel="stylesheet"
    />

    <!-- Our Mapbox JavaScript -->
    <script src="map.js" type="module"></script>
    <link rel="stylesheet" href="map.css" />
</head>
<body>
    <h1>🚴‍♀️ Bikewatching</h1>
    <p>
        An interactive visualization of bike lanes, bike stations,
        and bicycle traffic in Boston and Cambridge.
    </p>

    <div class="time-filter">
        <label for="time-slider">Time of day:</label>

        <input
            type="range"
            id="time-slider"
            min="0"
            max="1440"
            step="15"
            value="720"
        />

        <time id="selected-time">12:00 PM</time>
    </div>

    <div id="map">
        <svg id="station-overlay"></svg>
    </div>

    <div class="legend">
    <strong>Station Traffic Flow</strong>

    <div>
        <span class="legend-dot departures"></span>
        More departures
    </div>

    <div>
        <span class="legend-dot arrivals"></span>
        More arrivals
    </div>

    <div>
        <span class="legend-dot balanced"></span>
        Equal arrivals and departures
    </div>
</div>
</body>
</html>
